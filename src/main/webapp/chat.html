<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body {
            font-family: "Lato", sans-serif;
            margin: 0;
            padding: 0;
        }

        .sidenav {
            height: 100%;
            width: 200px;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            padding-top: 20px;
            transition: 0.3s;
        }

        .sidenav a {
            padding: 6px 6px 6px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }

        .sidenav a:hover {
            color: #f1f1f1;
        }

        .sidenav a.active {
            background-color: #575757;
            color: white;
        }

        .main {
            margin-left: 200px;
            padding: 20px;
        }

        .navName {
                color: white;
                text-align: center;
                font-size: 30px;
            }

        @media screen and (max-width: 768px) {
            .sidenav {
                width: 60px;
            }

            .sidenav a {
                padding: 6px;
                font-size: 18px;
                text-align: center;
            }

            .sidenav a::before {
                content: attr(data-icon);
                font-size: 25px;
                color: #818181;
                display: block;
            }

            .sidenav a span {
                display: none;
            }

            .sidenav a.active::before {
                color: white;
            }

            .navName {
                color: white;
                text-align: center;
                font-size: 20px;
            }
        }
</style>
</head>
<body>
  
    <div class="sidenav">
        <h1 class="navName">Komal</h1>
        <div style="border-bottom: 1px solid #888888;"></div>
        <a href="dashboard.html" data-icon="🏠" ><span>🏠 Home</span></a>
        <div style="border-bottom: 1px solid #d4d4d4;"></div>
        <a href="call.html" data-icon="📞" ><span>📞 Call</span></a>
        <div style="border-bottom: 1px solid #d4d4d4;"></div>
        <a href="chat.html" data-icon="👥" class="active"><span>👥 Chat</span></a>
        <div style="border-bottom: 1px solid #d4d4d4;"></div>
        <a href="editProfile.html" data-icon="🛠"><span>🛠 Edit Profile</span></a>
        <div style="border-bottom: 1px solid #d4d4d4;"></div>
    </div>
    
    <div class="main">
        <h2>Responsive Sidenav</h2>
        <p>This sidenav becomes icon-based on mobile view.</p>
    </div>
  </body>
</html>
